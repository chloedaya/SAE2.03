{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catégories</title>
    <link rel="stylesheet" href="{% static 'seefilm/style.css' %}">
</head>

<body>

<h1>Catégories de films</h1>

<a href="/catajout/">➕ Ajouter une catégorie</a>

<ul>
    {% for c in liste_categorie %}
        <li>
            {{ c.nomCat }} (ID: {{ c.idcategories }})

            <a href="/cataffiche/{{ c.idcategories }}/">Lire</a>
            <a href="/update/{{ c.idcategories }}/">Modifier</a>
            <a href="/delete/{{ c.idcategories }}/">Supprimer</a>
        </li>
    {% empty %}
        <li>Aucune catégorie disponible</li>
    {% endfor %}
</ul>
<a href="/">🏠Retourner à l'accueil🏠</a>
</body>
</html>
