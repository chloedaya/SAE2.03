{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ acteur.nomAct }} {{ acteur.prenomAct }}</title>
    <link rel="stylesheet" href="{% static 'seefilm/style.css' %}">
</head>
<body>

<h2>Acteur ajouté :</h2>

<p><strong>Nom :</strong> {{ acteur.nomAct }}</p>
<p><strong>Prénom :</strong> {{ acteur.prenomAct }}</p>
<p><strong>ID :</strong> {{ acteur.idacteurs }}</p>
<p><strong>Âge :</strong> {{ acteur.age }}</p>

{% if acteur.photo %}
    <p><strong>Photo :</strong></p>
    <img src="{{ acteur.photo.url }}" alt="{{ acteur.nomAct }}" width="200">
{% endif %}

<a href="/acteurs/">Retour à la liste</a>

</body>
</html>
